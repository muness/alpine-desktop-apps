name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/build-runtime.sh scripts/build-apk.sh
          for file in packaging/APKBUILD packaging/build-in-container.sh packaging/desktop-apps-runtime packaging/1password packaging/chatgpt packaging/portal-xdg-open; do
            sh -n "$file"
          done
      - name: Check whitespace
        run: git show --format= --check HEAD
