name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/build-runtime.sh scripts/build-apk.sh scripts/build-tailscale-qs-apk.sh scripts/build-obsidian-apk.sh
          for file in packaging/APKBUILD packaging/tailscale-qs/APKBUILD packaging/obsidian/APKBUILD packaging/obsidian/obsidian packaging/build-in-container.sh packaging/desktop-apps-runtime packaging/1password packaging/chatgpt packaging/browseros-neo packaging/portal-xdg-open; do
            sh -n "$file"
          done
      - name: Check Waydroid experiment
        run: |
          sh -n experiments/waydroid/install-setup.sh experiments/waydroid/prepare-kernel.sh experiments/waydroid/arm-recovery.sh experiments/waydroid/accept-kernel.sh
          python3 -m py_compile experiments/waydroid/fetch-images.py experiments/waydroid/dc1-waydroid-rollback
          python3 -m json.tool experiments/waydroid/images.json > /dev/null
          python3 -m json.tool experiments/waydroid/images-gapps.json > /dev/null
          python3 -m py_compile experiments/waydroid/setup/backend.py experiments/waydroid/setup/gui.py
          python3 -m unittest discover -s experiments/waydroid/setup -v
      - name: Check whitespace
        run: git show --format= --check HEAD
